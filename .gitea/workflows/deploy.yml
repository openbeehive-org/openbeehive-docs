# Gitea Actions — build the docs on every branch and PR, deploy on release tags.
# The Docusaurus build is the sanity check (onBrokenLinks: 'throw' fails the
# build on dead internal links). Deployment runs ONLY when a v* tag (e.g.
# v0.1.0, always tagged on main) is pushed. The deploy job is imported from
# johnny/build and receives the built site as an artifact - it never sees
# this repo's source.
#
# Secrets: the called workflow reads real stored secrets by these exact names
# (Gitea does not deliver values mapped in the caller's `secrets:` block):
#   SSH_SERVER, SSH_USER, SSH_PRIVATE_KEY, SSH_HOST_KEY (user-level) and
#   DEPLOY_REMOTE_PATH (absolute remote directory to rsync into, with a
#   trailing slash, e.g. /www/htdocs/<account>/docs.openbeehive.org/)

name: Check and deploy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded branch/PR builds; never cancel a tag deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Principle of least privilege
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # no npm cache: this job builds what tags deploy
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        # onBrokenLinks: 'throw' makes this fail on dead internal links.
        run: npm run build

      - name: Upload built site
        # NOT actions/upload-artifact: the official v4 action detects Gitea
        # as GHES and aborts. This fork is the same action with that check removed.
        uses: https://github.com/christopherhx/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          name: site
          path: build/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    # Deploy only on v* release tags — never from branches or PRs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: johnny/build/.gitea/workflows/deploy-static-page.yaml@v11 # zizmor: ignore[unpinned-uses] own workflow on this Gitea, tag under our control
    with:
      artifact-name: site
    secrets:
      SSH_SERVER: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
      DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
