# Runs `npm run check`, the definition of green: lint (Prettier, ESLint, tsc), site build
# (every version and locale), audit (npm advisories, licenses, unused deps, gitleaks) and fleetlint.
# Runs on GitHub only: Gitea ignores .github/workflows while .gitea/workflows exists.
# Actions are pinned to commit SHAs; Renovate keeps the pins current.
name: check
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly: catches new advisories in unchanged deps

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: fleetlint and gitleaks (pinned in package.json "tools")
        run: |
          npm run tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm run check
